<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

<style>
   
    body{background-image: url(https://images.pexels.com/photos/1169754/pexels-photo-1169754.jpeg?auto=compress&cs=tinysrgb&w=1600);
        background-repeat: no-repeat;
        background-size: cover;
        font-family: Tahoma;
        }

   .container{background-color: rgba(0, 0, 0, 0.500);
            color: white;
            margin: 20px;
            padding: 20px;
            width: 33%;
            height: auto;
            align-self: center;
            margin: 0 auto;}

</style>

</head>
<body>
    
<br>

<div class="container">

        <h1 style="text-align: center;">Non-Metal Elements</h1>
        <p style="text-align: justify;">Enter the symbol of a non-metal element (H, He, C).</p>
        <br>

        <label for="ElementInput">Element Symbol</label><br>
        <input type="text" id="ElementInput" placeholder="H" style="width: 50%;">
        <br><br>

        <button py-click="SearchSymbol" style="width: 100%; border: 10px white; background-color: white; color: black; font-family: Tahoma;">Search</button>

        <br><br>
        <hr>
        

        <div class="result">

            <h3 style="text-align: center;">Result</h3>

            <p>Element Symbol: <span id = "Symbol"> </span> </p>
            <p>Element Name: <span id = "EName"> </span> </p>
            <p>Atomic Number: <span id = "AtomicNo"> </span> </p>
            <p>Atomic Mass: <span id = "AtomicMass"> </span> </p>

        </div>

</div>

<p style="text-align: center; color: white;">@2026 Maria Alexandria Coronel | 10 - Ruby </p>
